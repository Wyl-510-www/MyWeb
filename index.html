<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>510 - 个人空间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,900;1,9..144,400&family=Caveat:wght@400;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <style>
    /* === CSS变量 === */
    :root {
      --_esther-ds: "esthersjw-v1";
      /* 使用 variables.css 中的自定义配色 */
      --blue: var(--color-primary);
      --blue-deep: #2C4690;
      --yellow: var(--color-accent);
      --yellow-soft: #FFF3CD;
      --red: var(--color-highlight);
      --cream: var(--color-bg);
      --cream-dark: #f3efe4;
      --ink: var(--color-text);
      --ink-light: #4A4A5A;
      --ink-faint: #8A8A9A;
      --dark-panel: #151821;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink);
      background: var(--cream);
    }

    ::selection {
      background: var(--yellow);
      color: var(--ink);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* === NAV === */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1rem 2rem;
      background: rgba(248,246,240,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(26,26,26,.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav.scrolled {
      box-shadow: 0 2px 20px rgba(0,0,0,.06);
    }
    .nav-logo {
      font-family: 'Fraunces', serif;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--ink);
    }
    .nav-links {
      display: flex;
      gap: 2rem;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--ink);
      font-size: 0.85rem;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0; right: 0;
      height: 2px;
      background: var(--yellow);
      transform: scaleX(0);
      transition: transform .25s ease-out;
    }
    .nav-links a:hover::after {
      transform: scaleX(1);
    }

    /* === HERO 全屏 === */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -20%; right: -10%;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,214,70,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -10%; left: -5%;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52,87,184,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1.5rem;
      border: 4px solid var(--white);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    .hero h1 {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.15;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      color: var(--ink-light);
      max-width: 560px;
      margin-bottom: 2.5rem;
    }

    /* === Sections === */
    .section { padding: clamp(80px, 12vh, 160px) 0; }
    .section--alt { background: var(--cream-dark); }

    .section-header {
      margin-bottom: clamp(40px, 6vw, 80px);
      text-align: center;
    }
    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
    }

    /* === 导航卡片 === */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(20px, 2.5vw, 32px);
      max-width: 1200px;
      margin: 0 auto;
    }
    .nav-card {
      background: var(--white);
      border-radius: 20px;
      padding: clamp(28px, 3vw, 40px);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.05);
      transition: transform 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .nav-card:hover {
      transform: translateY(-4px);
    }
    .nav-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }
    .nav-card:nth-child(1)::before { background: var(--blue); }
    .nav-card:nth-child(2)::before { background: var(--yellow); }
    .nav-card:nth-child(3)::before { background: var(--red); }
    .nav-card:nth-child(4)::before { background: var(--blue); }

    .nav-card-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }
    .nav-card:nth-child(1) .nav-card-icon { background: rgba(52,87,184,0.08); }
    .nav-card:nth-child(2) .nav-card-icon { background: rgba(255,214,70,0.15); }
    .nav-card:nth-child(3) .nav-card-icon { background: rgba(226,85,85,0.08); }
    .nav-card:nth-child(4) .nav-card-icon { background: rgba(52,87,184,0.08); }

    .nav-card-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .nav-card-desc {
      font-size: 0.88rem;
      color: var(--ink-light);
      line-height: 1.7;
    }

    /* === Footer === */
    .footer {
      padding: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--ink-faint);
      border-top: 1px solid rgba(0,0,0,0.04);
    }

    /* === Scroll Reveal === */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }
    .reveal-d4 { transition-delay: 0.4s; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* === 响应式 === */
    @media (max-width: 900px) {
      .hero { min-height: auto; padding: 6rem 1.5rem 4rem; }
      .nav-grid { grid-template-columns: repeat(2, 1fr); }
      .nav-links { gap: 1rem; }
    }

    @media (max-width: 600px) {
      body { font-size: 15px; }
      .nav-links { display: none; }
      .nav-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ====== NAV ====== -->
  <nav>
    <span class="nav-logo">MyWeb</span>
    <div class="nav-links">
      <a href="#portfolio">作品集</a>
      <a href="#notes">学习笔记</a>
      <a href="#life">生活记录</a>
      <a href="#about">关于我</a>
    </div>
  </nav>

  <!-- ====== HERO 全屏 ====== -->
  <section class="hero">
    <img src="assets/avatar.jpg" alt="头像" class="hero-avatar">
    <h1>欢迎来到我的空间</h1>
    <p class="hero-subtitle">记录技术成长，分享学习笔记，沉淀生活点滴</p>
  </section>

  <!-- ====== 导航卡片区 ====== -->
  <section class="section section--alt">
    <div class="container">
      <div class="nav-grid">
        <a href="portfolio.html" class="nav-card reveal reveal-d1">
          <div class="nav-card-icon">💼</div>
          <h3 class="nav-card-title">作品集</h3>
          <p class="nav-card-desc">技术项目展示，包含技术栈、项目描述和成果链接</p>
        </a>
        <a href="notes.html" class="nav-card reveal reveal-d2">
          <div class="nav-card-icon">📚</div>
          <h3 class="nav-card-title">学习笔记</h3>
          <p class="nav-card-desc">技术学习历程、踩坑经验和知识总结</p>
        </a>
        <a href="life.html" class="nav-card reveal reveal-d3">
          <div class="nav-card-icon">✨</div>
          <h3 class="nav-card-title">生活记录</h3>
          <p class="nav-card-desc">记录生活瞬间、思考感悟和日常随笔</p>
        </a>
        <a href="about.html" class="nav-card reveal reveal-d4">
          <div class="nav-card-icon">👋</div>
          <h3 class="nav-card-title">关于我</h3>
          <p class="nav-card-desc">个人简介、技能展示和联系方式</p>
        </a>
      </div>
    </div>
  </section>

  <!-- ====== Footer ====== -->
  <footer class="footer">
    <p>MyWeb © 2026 · Powered by Esther Design System</p>
  </footer>

  <!-- ====== Scripts ====== -->
  <script>
    // Scroll Reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Nav scroll effect
    window.addEventListener('scroll', () => {
      document.querySelector('nav').classList.toggle('scrolled', window.scrollY > 40);
    });
  </script>

</body>
</html>
