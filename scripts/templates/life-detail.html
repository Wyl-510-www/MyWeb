<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} - 510 的生活记录</title>

  <!-- Google Fonts 预连接优化 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 引入字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,900;1,9..144,400&family=Caveat:wght@400;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,900;1,9..144,400&family=Caveat:wght@400;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"></noscript>

  <!-- 样式表 -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../components/nav/nav.css">
  <link rel="stylesheet" href="../components/footer/footer.css">
  <link rel="stylesheet" href="../css/life-detail.css">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body>

  <!-- 导航栏 -->
  <nav>
    <span class="nav-logo">MyWeb</span>
    <div class="nav-links">
      <a href="../portfolio.html">作品集</a>
      <a href="../notes.html">学习笔记</a>
      <a href="../life.html">生活记录</a>
      <a href="../about.html">关于我</a>
    </div>
  </nav>

  <main>

  <!-- 文章内容 -->
  <article class="life-article">
    <div class="container">
      <!-- 文章头部 -->
      <header class="life-header">
        <h1 class="life-title">{{title}}</h1>
        <div class="life-date-wrapper">
          <span class="life-date">{{date}}</span>
        </div>
        <div class="life-tags">
          {{tags}}
        </div>
      </header>

      <!-- 图片画廊 -->
      {{images}}

      <!-- 文章正文 -->
      <div class="life-content">
        {{content}}
      </div>

      <!-- 返回导航 -->
      <div class="life-footer">
        <a href="../life.html" class="btn-back">← 返回生活记录</a>
      </div>
    </div>
  </article>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <h2 class="footer-title">联系我</h2>
      <p class="footer-subtitle">欢迎交流讨论，期待与你连接</p>

      <div class="numgrid">
        <div class="numgrid-card" data-num="01">
          <div class="numgrid-icon">📧</div>
          <h4>邮箱</h4>
          <p>wyl510www@gmail.com</p>
        </div>
        <div class="numgrid-card" data-num="02">
          <div class="numgrid-icon">🔗</div>
          <h4>GitHub</h4>
          <a href="https://github.com/Wyl-510-www" target="_blank" class="numgrid-link">@Wyl-510-www</a>
        </div>
      </div>

      <p class="footer-credits">MyWeb © 2026 · Powered by Esther Design System</p>
    </div>
  </footer>

  <!-- 图片画廊脚本 -->
  <script src="../scripts/image-gallery.js"></script>

  <!-- © ESTHER不二 esthersjw/esther-design-system CC BY-NC 4.0 -->
</body>
</html>
